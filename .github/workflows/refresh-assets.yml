name: refresh assets

# Regenera os SVGs do perfil (assets/numeros.svg e assets/atividade.svg) com
# dados reais da API do GitHub. Roda todo dia e também sob demanda (aba Actions
# → "refresh assets" → Run workflow).
on:
  schedule:
    - cron: "17 6 * * *"     # 06:17 UTC = 03:17 em São Paulo
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate_assets.py"
      - ".github/workflows/refresh-assets.yml"

permissions:
  contents: write

concurrency:
  group: refresh-assets
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: gerar SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python3 scripts/generate_assets.py --out assets

      - name: commitar se mudou
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet --exit-code -- assets; then
            echo "nada mudou hoje."
          else
            git add assets/numeros.svg assets/atividade.svg
            git commit -m "chore(assets): regenera números e atividade [skip ci]"
            git push
          fi
