      </path>
      <path d="M-40 268 C 260 208, 430 336, 700 262 S 1040 170, 1320 268" stroke="url(#bn-a2)" stroke-width="18" opacity="0.85">
        <animate attributeName="d" dur="23s" repeatCount="indefinite"
