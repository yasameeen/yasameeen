<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="banner: aurora and constellation artwork with the line 'whoami: product engineer, AI in education'">
  <title>Banner</title>
  <defs>
    <linearGradient id="bn-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06030f"/><stop offset="45%" stop-color="#0b0620"/><stop offset="100%" stop-color="#0d0828"/>
    </linearGradient>
    <radialGradient id="bn-pink" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0%" stop-color="#e879f9" stop-opacity="0.30"/><stop offset="100%" stop-color="#e879f9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bn-cyan" cx="0.14" cy="0.9" r="0.6">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.22"/><stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bn-violet" cx="0.92" cy="0.14" r="0.6">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.40"/><stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bn-a1" gradientUnits="userSpaceOnUse" x1="0" y1="180" x2="1280" y2="180">
      <stop offset="0%" stop-color="#f6c177" stop-opacity="0.85"/>
      <stop offset="28%" stop-color="#e879f9" stop-opacity="0.9"/>
      <stop offset="62%" stop-color="#a78bfa" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#67e8f9" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="bn-a2" gradientUnits="userSpaceOnUse" x1="0" y1="260" x2="1280" y2="260">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#a855f7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f6c177" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="bn-a3" gradientUnits="userSpaceOnUse" x1="0" y1="120" x2="1280" y2="120">
      <stop offset="0%" stop-color="#e879f9" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="bn-soft" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="17"/></filter>
    <filter id="bn-mid" x="-20%" y="-80%" width="140%" height="260%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="bn-glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="bn-clip"><rect width="1280" height="400" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#bn-clip)">
    <rect width="1280" height="400" fill="url(#bn-bg)"/>
    <rect width="1280" height="400" fill="url(#bn-violet)"/>
    <rect width="1280" height="400" fill="url(#bn-pink)"/>
    <rect width="1280" height="400" fill="url(#bn-cyan)"/>

    <g fill="none" stroke-linecap="round">
      <path d="M-40 214 C 190 120, 360 292, 600 196 S 1030 96, 1320 190" stroke="url(#bn-a3)" stroke-width="66" opacity="0.5" filter="url(#bn-soft)">
        <animate attributeName="d" dur="26s" repeatCount="indefinite"
          values="M-40 214 C 190 120, 360 292, 600 196 S 1030 96, 1320 190;M-40 196 C 210 250, 380 128, 620 214 S 1010 150, 1320 168;M-40 214 C 190 120, 360 292, 600 196 S 1030 96, 1320 190"/>
      </path>
      <path d="M-40 236 C 220 160, 400 320, 660 224 S 1020 130, 1320 226" stroke="url(#bn-a1)" stroke-width="30" filter="url(#bn-mid)">
        <animate attributeName="d" dur="19s" repeatCount="indefinite"
