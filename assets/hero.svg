<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="Iasmin Nogueira — engenheira de software: IA, agentes e edtech">
  <title>Iasmin Nogueira — grimório</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07030f"/>
      <stop offset="45%" stop-color="#0d0620"/>
      <stop offset="100%" stop-color="#120726"/>
    </linearGradient>
    <radialGradient id="nebula" cx="0.22" cy="0.28" r="0.75">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#4c1d95" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula2" cx="0.85" cy="0.75" r="0.7">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.30"/>
      <stop offset="60%" stop-color="#0e7490" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="inkGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="35%" stop-color="#f6c177"/>
      <stop offset="70%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="inkViolet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#e9d5ff"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0"/>
      <stop offset="50%" stop-color="#e9d5ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <!-- linha horizontal: gradientUnits userSpaceOnUse é obrigatório aqui, um path
         horizontal em y constante tem bbox de altura 0 e o gradiente em
         objectBoundingBox degenera (a linha desaparece). -->
    <linearGradient id="lineH" gradientUnits="userSpaceOnUse" x1="88" y1="214" x2="780" y2="214">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0"/>
      <stop offset="22%" stop-color="#e9d5ff" stop-opacity="0.75"/>
      <stop offset="60%" stop-color="#c4b5fd" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="titleHalo">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.42"/>
      <stop offset="45%" stop-color="#7c3aed" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="typeClip"><rect x="0" y="0" width="0" height="360">
      <animate attributeName="width" from="0" to="620" dur="2.4s" begin="1.1s" fill="freeze" calcMode="spline" keySplines="0.2 0.9 0.2 1"/>
    </rect></clipPath>
    <clipPath id="heroClip"><rect x="0" y="0" width="1280" height="360" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#heroClip)">
    <rect width="1280" height="360" fill="url(#bg)"/>
    <rect width="1280" height="360" fill="url(#nebula)">
      <animate attributeName="opacity" values="0.85;1;0.9;1;0.85" dur="14s" repeatCount="indefinite"/>
    </rect>
    <rect width="1280" height="360" fill="url(#nebula2)"/>

    <!-- grade arcana -->
    <g stroke="#a78bfa" stroke-opacity="0.10" stroke-width="1">
      <path d="M0 300 H1280 M0 240 H1280 M0 180 H1280 M0 120 H1280 M0 60 H1280"/>
      <path d="M160 0 V360 M400 0 V360 M640 0 V360 M880 0 V360 M1120 0 V360"/>
    </g>
    <rect width="1280" height="360" filter="url(#grain)" opacity="0.05"/>

    <!-- campo de estrelas -->
    <g fill="#e9d5ff">
      <g>
        <circle cx="48" cy="42" r="1.5" opacity="0.7"/><animate attributeName="opacity" values="0.15;0.95;0.2" dur="4.1s" repeatCount="indefinite"/>
      </g>
      <g><circle cx="132" cy="88" r="1.1" opacity="0.5"/><animate attributeName="opacity" values="0.1;0.8;0.15" dur="5.3s" begin="0.4s" repeatCount="indefinite"/></g>
      <g><circle cx="210" cy="30" r="1.8" opacity="0.65"/><animate attributeName="opacity" values="0.2;1;0.25" dur="3.4s" begin="0.9s" repeatCount="indefinite"/></g>
      <g><circle cx="300" cy="132" r="1.2" opacity="0.55"/><animate attributeName="opacity" values="0.15;0.85;0.2" dur="6.2s" begin="1.4s" repeatCount="indefinite"/></g>
      <g><circle cx="372" cy="52" r="1.4" opacity="0.6"/><animate attributeName="opacity" values="0.1;0.9;0.2" dur="4.8s" begin="0.2s" repeatCount="indefinite"/></g>
      <g><circle cx="452" cy="108" r="1" opacity="0.5"/><animate attributeName="opacity" values="0.2;0.75;0.15" dur="5.7s" begin="2.1s" repeatCount="indefinite"/></g>
      <g><circle cx="540" cy="36" r="1.6" opacity="0.7"/><animate attributeName="opacity" values="0.15;1;0.2" dur="3.9s" begin="1.1s" repeatCount="indefinite"/></g>
      <g><circle cx="612" cy="150" r="1.1" opacity="0.5"/><animate attributeName="opacity" values="0.1;0.8;0.2" dur="6.8s" begin="0.7s" repeatCount="indefinite"/></g>
      <g><circle cx="700" cy="62" r="1.3" opacity="0.6"/><animate attributeName="opacity" values="0.2;0.9;0.15" dur="5.1s" begin="1.7s" repeatCount="indefinite"/></g>
      <g><circle cx="788" cy="118" r="1.7" opacity="0.65"/><animate attributeName="opacity" values="0.15;1;0.25" dur="4.4s" begin="0.5s" repeatCount="indefinite"/></g>
      <g><circle cx="872" cy="44" r="1.2" opacity="0.55"/><animate attributeName="opacity" values="0.1;0.85;0.2" dur="6.5s" begin="2.4s" repeatCount="indefinite"/></g>
      <g><circle cx="958" cy="96" r="1.5" opacity="0.6"/><animate attributeName="opacity" values="0.2;0.95;0.15" dur="5.5s" begin="1.2s" repeatCount="indefinite"/></g>
      <g><circle cx="1046" cy="34" r="1.1" opacity="0.5"/><animate attributeName="opacity" values="0.15;0.8;0.2" dur="4.6s" begin="0.3s" repeatCount="indefinite"/></g>
      <g><circle cx="1128" cy="140" r="1.6" opacity="0.65"/><animate attributeName="opacity" values="0.1;1;0.2" dur="3.7s" begin="1.9s" repeatCount="indefinite"/></g>
      <g><circle cx="1214" cy="70" r="1.3" opacity="0.55"/><animate attributeName="opacity" values="0.2;0.9;0.15" dur="5.9s" begin="0.8s" repeatCount="indefinite"/></g>
      <g><circle cx="86" cy="196" r="1.2" opacity="0.45"/><animate attributeName="opacity" values="0.1;0.7;0.15" dur="6.1s" begin="2.8s" repeatCount="indefinite"/></g>
      <g><circle cx="246" cy="252" r="1.5" opacity="0.5"/><animate attributeName="opacity" values="0.15;0.85;0.2" dur="5.2s" begin="1.5s" repeatCount="indefinite"/></g>
      <g><circle cx="1010" cy="228" r="1.4" opacity="0.5"/><animate attributeName="opacity" values="0.1;0.9;0.2" dur="4.9s" begin="0.6s" repeatCount="indefinite"/></g>
      <g><circle cx="1180" cy="292" r="1.2" opacity="0.45"/><animate attributeName="opacity" values="0.2;0.8;0.15" dur="6.7s" begin="2.2s" repeatCount="indefinite"/></g>
      <g><circle cx="430" cy="300" r="1.3" opacity="0.45"/><animate attributeName="opacity" values="0.15;0.75;0.2" dur="5.8s" begin="1.3s" repeatCount="indefinite"/></g>
      <g><circle cx="660" cy="268" r="1.1" opacity="0.4"/><animate attributeName="opacity" values="0.1;0.7;0.15" dur="7.1s" begin="3.1s" repeatCount="indefinite"/></g>
      <g><circle cx="812" cy="322" r="1.4" opacity="0.4"/><animate attributeName="opacity" values="0.15;0.8;0.2" dur="6.3s" begin="0.9s" repeatCount="indefinite"/></g>
    </g>

    <!-- constelação desenhando -->
    <g fill="none" stroke="url(#line)" stroke-width="1.1">
      <path d="M1040 96 L1120 62 L1192 104 L1160 168 L1080 158 Z" stroke-dasharray="520" stroke-dashoffset="520">
        <animate attributeName="stroke-dashoffset" from="520" to="0" dur="3.2s" begin="0.4s" fill="freeze" calcMode="spline" keySplines="0.3 0.8 0.2 1"/>
      </path>
      <path d="M1120 62 L1160 168" stroke-dasharray="200" stroke-dashoffset="200" opacity="0.6">
        <animate attributeName="stroke-dashoffset" from="200" to="0" dur="1.6s" begin="2.6s" fill="freeze"/>
      </path>
    </g>
    <g fill="#fef3c7">
      <circle cx="1040" cy="96" r="2.6" filter="url(#glow)"><animate attributeName="r" values="2.2;3.2;2.2" dur="3.6s" repeatCount="indefinite"/></circle>
      <circle cx="1120" cy="62" r="3.1" filter="url(#glow)"><animate attributeName="r" values="2.8;3.8;2.8" dur="4.4s" repeatCount="indefinite"/></circle>
      <circle cx="1192" cy="104" r="2.4" filter="url(#glow)"><animate attributeName="r" values="2;3;2" dur="3.1s" repeatCount="indefinite"/></circle>
      <circle cx="1160" cy="168" r="2.8" filter="url(#glow)"><animate attributeName="r" values="2.4;3.4;2.4" dur="5.2s" repeatCount="indefinite"/></circle>
      <circle cx="1080" cy="158" r="2.2" filter="url(#glow)"><animate attributeName="r" values="1.9;2.9;1.9" dur="4.1s" repeatCount="indefinite"/></circle>
    </g>

    <!-- estrelas cadentes -->
    <g stroke="#fef9c3" stroke-width="1.6" stroke-linecap="round" opacity="0">
      <line x1="0" y1="0" x2="54" y2="22">
        <animate attributeName="opacity" values="0;0.9;0" dur="2.4s" begin="2.2s" repeatCount="indefinite"/>
      </line>
      <animateTransform attributeName="transform" type="translate" values="180,-40; 900,300" dur="9s" begin="2.2s" repeatCount="indefinite"/>
    </g>
    <g stroke="#a5f3fc" stroke-width="1.3" stroke-linecap="round" opacity="0">
      <line x1="0" y1="0" x2="42" y2="18">
        <animate attributeName="opacity" values="0;0.75;0" dur="2s" begin="7.4s" repeatCount="indefinite"/>
      </line>
      <animateTransform attributeName="transform" type="translate" values="420,-60; 1200,240" dur="12s" begin="7.4s" repeatCount="indefinite"/>
    </g>

    <!-- selo arcano -->
    <g transform="translate(1120,186)" opacity="0.95">
      <circle r="66" fill="none" stroke="#a78bfa" stroke-opacity="0.35" stroke-width="1"/>
      <circle r="52" fill="none" stroke="#67e8f9" stroke-opacity="0.28" stroke-width="1" stroke-dasharray="4 7">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="48s" repeatCount="indefinite"/>
      </circle>
      <circle r="38" fill="none" stroke="#e879f9" stroke-opacity="0.30" stroke-width="1" stroke-dasharray="1 9">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="34s" repeatCount="indefinite"/>
      </circle>
      <g fill="none" stroke="#fde68a" stroke-opacity="0.55" stroke-width="1.2" filter="url(#glow)">
        <path d="M0 -34 L9.9 -10.5 L34 -10.5 L14.5 3.7 L22.4 27.5 L0 13.6 L-22.4 27.5 L-14.5 3.7 L-34 -10.5 L-9.9 -10.5 Z">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="90s" repeatCount="indefinite"/>
          <animate attributeName="stroke-opacity" values="0.35;0.8;0.35" dur="6s" repeatCount="indefinite"/>
        </path>
      </g>
      <circle r="5.5" fill="#fde68a" filter="url(#glow)">
        <animate attributeName="r" values="4.5;7;4.5" dur="5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- título -->
    <g transform="translate(88,116)">
      <ellipse cx="-4" cy="-26" rx="230" ry="76" fill="url(#titleHalo)"/>
      <text x="0" y="0" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif" font-size="69" letter-spacing="7" fill="none" stroke="#a78bfa" stroke-opacity="0.25" stroke-width="1">IASMIN NOGUEIRA</text>
      <text x="0" y="0" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif" font-size="69" letter-spacing="7" fill="url(#inkGold)">IASMIN NOGUEIRA
        <animate attributeName="opacity" values="0;1" dur="1.2s" begin="0.2s" fill="freeze"/>
      </text>
    </g>

    <!-- subtítulo com efeito de escrita -->
    <g transform="translate(92,168)">
      <text x="0" y="0" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17.5" letter-spacing="1.6" fill="#c4b5fd" opacity="0.55">engenheira de software · ia &amp; agentes · edtech</text>
      <g clip-path="url(#typeClip)">
        <text x="0" y="0" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17.5" letter-spacing="1.6" fill="url(#inkViolet)">engenheira de software · ia &amp; agentes · edtech</text>
      </g>
      <rect x="0" y="-16" width="2" height="20" fill="#67e8f9" opacity="0.9">
        <animate attributeName="x" values="0;620;0" dur="2.4s" begin="1.1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.9;0" dur="2.4s" begin="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- linha divisória pulsante -->
    <path d="M88 214 H780" stroke="url(#lineH)" stroke-width="1.4" fill="none">
      <animate attributeName="stroke-opacity" values="0.35;1;0.35" dur="6.5s" repeatCount="indefinite"/>
    </path>

    <!-- pilares -->
    <g font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#cbd5e1">
      <g transform="translate(88,252)">
        <text x="0" y="0" fill="#e9d5ff" letter-spacing="2.4" font-size="11.5">PRODUÇÃO</text>
        <text x="0" y="24" fill="#a5b4fc" letter-spacing="1">Vue 3 · Vite · .NET/C# · Firebase · Postgres · GCP</text>
      </g>
      <g transform="translate(88,320)">
        <text x="0" y="0" fill="#e9d5ff" letter-spacing="2.4" font-size="11.5">OFÍCIO</text>
        <text x="0" y="24" fill="#a5b4fc" letter-spacing="1">pipelines de LLM · correção de redação/OCR · orquestração de agentes</text>
      </g>
    </g>

    <!-- fileira de runas -->
    <g transform="translate(1000,306)" stroke="#f6c177" stroke-width="1.8" fill="none" stroke-linecap="round" opacity="0.85">
      <g transform="translate(0,0)">
        <path d="M2 2 V26 M2 2 L14 7 L2 12"/>
        <animate attributeName="opacity" values="0.45;1;0.45" dur="5.5s" repeatCount="indefinite"/>
      </g>
      <g transform="translate(26,0)">
        <path d="M9 26 V4 M9 8 L2 2 M9 8 L16 2"/>
        <animate attributeName="opacity" values="0.45;1;0.45" dur="5.5s" begin="0.7s" repeatCount="indefinite"/>
      </g>
      <g transform="translate(52,0)">
        <path d="M9 2 V26 M9 10 L2 2 M9 10 L16 2"/>
        <animate attributeName="opacity" values="0.45;1;0.45" dur="5.5s" begin="1.4s" repeatCount="indefinite"/>
      </g>
      <g transform="translate(78,0)">
        <path d="M9 26 V15 L3 9 V3 H15 V9 L9 15"/>
        <animate attributeName="opacity" values="0.45;1;0.45" dur="5.5s" begin="2.1s" repeatCount="indefinite"/>
      </g>
      <g transform="translate(104,0)">
        <path d="M2 2 L16 26 M16 2 L2 26"/>
        <animate attributeName="opacity" values="0.45;1;0.45" dur="5.5s" begin="2.8s" repeatCount="indefinite"/>
      </g>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="1279" height="359" rx="18" fill="none" stroke="#a78bfa" stroke-opacity="0.30"/>
</svg>
