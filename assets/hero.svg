      </path>
    </g>

    <g stroke="#a78bfa" stroke-opacity="0.07"><path d="M0 100 H1280 M0 200 H1280 M0 300 H1280 M213 0 V400 M426 0 V400 M640 0 V400 M853 0 V400 M1066 0 V400"/></g>
    <g fill="#fff8e7">
      <circle cx="86" cy="66" r="1.5"><animate attributeName="opacity" values="0.2;1;0.25" dur="4.6s" repeatCount="indefinite"/></circle>
      <circle cx="196" cy="132" r="1.1"><animate attributeName="opacity" values="0.1;0.85;0.15" dur="6s" begin="0.7s" repeatCount="indefinite"/></circle>
      <circle cx="318" cy="58" r="1.7"><animate attributeName="opacity" values="0.15;1;0.2" dur="5.2s" begin="1.2s" repeatCount="indefinite"/></circle>
      <circle cx="452" cy="146" r="1.2"><animate attributeName="opacity" values="0.1;0.8;0.2" dur="6.6s" begin="0.4s" repeatCount="indefinite"/></circle>
      <circle cx="574" cy="72" r="1.4"><animate attributeName="opacity" values="0.2;0.95;0.15" dur="4.2s" begin="1.8s" repeatCount="indefinite"/></circle>
      <circle cx="690" cy="150" r="1.1"><animate attributeName="opacity" values="0.1;0.8;0.2" dur="5.8s" begin="2.3s" repeatCount="indefinite"/></circle>
      <circle cx="806" cy="62" r="1.6"><animate attributeName="opacity" values="0.15;1;0.2" dur="4.9s" begin="0.9s" repeatCount="indefinite"/></circle>
      <circle cx="928" cy="140" r="1.2"><animate attributeName="opacity" values="0.1;0.85;0.15" dur="6.2s" begin="1.5s" repeatCount="indefinite"/></circle>
      <circle cx="1052" cy="66" r="1.5"><animate attributeName="opacity" values="0.2;1;0.25" dur="5.4s" begin="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="1186" cy="146" r="1.3"><animate attributeName="opacity" values="0.1;0.9;0.2" dur="5.9s" begin="0.3s" repeatCount="indefinite"/></circle>
      <circle cx="1240" cy="60" r="1.1"><animate attributeName="opacity" values="0.15;0.85;0.2" dur="6.4s" begin="1.9s" repeatCount="indefinite"/></circle>
      <circle cx="140" cy="330" r="1.3"><animate attributeName="opacity" values="0.1;0.9;0.2" dur="5.1s" begin="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="360" cy="356" r="1.2"><animate attributeName="opacity" values="0.2;0.9;0.15" dur="5.7s" begin="0.5s" repeatCount="indefinite"/></circle>
      <circle cx="640" cy="372" r="1.4"><animate attributeName="opacity" values="0.1;1;0.2" dur="4.8s" begin="1.3s" repeatCount="indefinite"/></circle>
      <circle cx="900" cy="352" r="1.2"><animate attributeName="opacity" values="0.15;0.85;0.2" dur="6.1s" begin="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="1140" cy="336" r="1.3"><animate attributeName="opacity" values="0.1;0.9;0.15" dur="5.3s" begin="0.8s" repeatCount="indefinite"/></circle>
    </g>

    <g stroke="#fef9c3" stroke-width="1.6" stroke-linecap="round" opacity="0">
      <line x1="0" y1="0" x2="60" y2="24"><animate attributeName="opacity" values="0;0.9;0" dur="2.6s" begin="1.6s" repeatCount="indefinite"/></line>
      <animateTransform attributeName="transform" type="translate" values="120,-40; 880,330" dur="10s" begin="1.6s" repeatCount="indefinite"/>
    </g>
    <g stroke="#a5f3fc" stroke-width="1.3" stroke-linecap="round" opacity="0">
      <line x1="0" y1="0" x2="44" y2="18"><animate attributeName="opacity" values="0;0.75;0" dur="2.1s" begin="7s" repeatCount="indefinite"/></line>
      <animateTransform attributeName="transform" type="translate" values="520,-50; 1240,260" dur="13s" begin="7s" repeatCount="indefinite"/>
    </g>

    <g fill="none" stroke="#c4b5fd" stroke-opacity="0.42" stroke-width="1.1">
      <path d="M980 96 L1088 62 L1190 108 L1152 178 L1046 166 Z" stroke-dasharray="520" stroke-dashoffset="520">
        <animate attributeName="stroke-dashoffset" from="520" to="0" dur="3.2s" begin="0.4s" fill="freeze" calcMode="spline" keySplines="0.3 0.8 0.2 1"/>
      </path>
      <path d="M1088 62 L1152 178" stroke-dasharray="180" stroke-dashoffset="180" stroke-opacity="0.28">
        <animate attributeName="stroke-dashoffset" from="180" to="0" dur="1.8s" begin="2.8s" fill="freeze"/>
      </path>
    </g>
    <g fill="#fde68a" filter="url(#bn-glow)">
