      <circle cx="1088" cy="62" r="3.6"><animate attributeName="r" values="3;4.4;3" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="1190" cy="108" r="2.8"><animate attributeName="r" values="2.4;3.6;2.4" dur="3.7s" repeatCount="indefinite"/></circle>
      <circle cx="1152" cy="178" r="3.2"><animate attributeName="r" values="2.8;4;2.8" dur="5.6s" repeatCount="indefinite"/></circle>
      <circle cx="1046" cy="166" r="2.6"><animate attributeName="r" values="2.2;3.4;2.2" dur="4.6s" repeatCount="indefinite"/></circle>
    </g>

    <g transform="translate(300,206)" opacity="0.95">
      <circle r="58" fill="none" stroke="#a78bfa" stroke-opacity="0.30" stroke-width="1"/>
      <circle r="44" fill="none" stroke="#67e8f9" stroke-opacity="0.26" stroke-width="1" stroke-dasharray="4 8">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="46s" repeatCount="indefinite"/>
      </circle>
      <circle r="31" fill="none" stroke="#e879f9" stroke-opacity="0.28" stroke-width="1" stroke-dasharray="1 9">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="32s" repeatCount="indefinite"/>
      </circle>
      <path d="M0 -27 L7.9 -8.3 L27 -8.3 L11.6 2.9 L17.9 21.9 L0 10.8 L-17.9 21.9 L-11.6 2.9 L-27 -8.3 L-7.9 -8.3 Z" fill="none" stroke="#fde68a" stroke-opacity="0.6" stroke-width="1.2" filter="url(#bn-glow)">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="80s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values="0.35;0.75;0.35" dur="6s" repeatCount="indefinite"/>
      </path>
      <circle r="4.4" fill="#fde68a" filter="url(#bn-glow)"><animate attributeName="r" values="3.6;5.6;3.6" dur="5s" repeatCount="indefinite"/></circle>
    </g>

    <rect x="56" y="252" width="430" height="104" rx="12" fill="#080414" fill-opacity="0.55" stroke="#a78bfa" stroke-opacity="0.18"/>
    <g transform="translate(72,286)" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace">
      <text x="0" y="0" font-size="14.5" fill="#f6c177">iasmin@github<tspan fill="#8b81ad"> % </tspan> <tspan fill="#e9d5ff">whoami</tspan></text>
      <text x="0" y="28" font-size="14.5" fill="#67e8f9">product engineer · ai in education</text>
      <text x="0" y="56" font-size="14.5" fill="#c4b5fd">data · full stack · 600k+ students reached</text>
      <rect x="0" y="70" width="10" height="17" fill="#fde68a" opacity="0.9">
        <animate attributeName="opacity" values="0.9;0;0.9" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>
