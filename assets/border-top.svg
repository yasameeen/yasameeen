<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 64" width="1280" height="64" role="img" aria-label="borda decorativa animada — linha do amanhecer">
  <title>top border — dawn line</title>
  <defs>
    <linearGradient id="bt-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a0518"/><stop offset="45%" stop-color="#150a35"/><stop offset="100%" stop-color="#0a0518"/>
    </linearGradient>
    <!-- linha horizontal: precisa de userSpaceOnUse (bbox sem altura) -->
    <linearGradient id="bt-line" gradientUnits="userSpaceOnUse" x1="0" y1="34" x2="1280" y2="34">
      <stop offset="0%" stop-color="#f6c177"/>
      <stop offset="30%" stop-color="#e879f9"/>
      <stop offset="62%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="bt-sweep" gradientUnits="userSpaceOnUse" x1="0" y1="34" x2="420" y2="34">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="bt-hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <line x1="0" y1="0" x2="0" y2="14" stroke="#a78bfa" stroke-opacity="0.07" stroke-width="6"/>
    </pattern>
    <filter id="bt-glow" x="-30%" y="-300%" width="160%" height="700%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="bt-clip"><rect width="1280" height="64" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#bt-clip)">
    <rect width="1280" height="64" fill="url(#bt-bg)"/>
    <rect width="1280" height="64" fill="url(#bt-hatch)"/>
    <rect x="0" y="0" width="1280" height="1.4" fill="url(#bt-line)" opacity="0.75"/>

    <!-- trilha principal -->
    <path d="M0 34 H1280" stroke="url(#bt-line)" stroke-width="2" fill="none" opacity="0.9" filter="url(#bt-glow)"/>
    <path d="M0 34 H1280" stroke="#a78bfa" stroke-opacity="0.18" stroke-width="1" fill="none" transform="translate(0,-9)"/>
    <path d="M0 34 H1280" stroke="#67e8f9" stroke-opacity="0.14" stroke-width="1" fill="none" transform="translate(0,9)"/>

    <!-- brilho viajando pela borda -->
    <rect x="-420" y="27" width="420" height="14" fill="url(#bt-sweep)" opacity="0.55">
      <animate attributeName="x" values="-420;1280" dur="7.5s" repeatCount="indefinite"/>
    </rect>

    <!-- selos girando na trilha (decoração controlada) -->
    <g fill="none" stroke-width="1.3">
      <g transform="translate(190,34)">
        <circle r="11" stroke="#f6c177" stroke-opacity="0.55"/>
        <path d="M0 -7 L6 0 L0 7 L-6 0 Z" stroke="#fde68a" stroke-opacity="0.9">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="26s" repeatCount="indefinite"/>
        </path>
      </g>
      <g transform="translate(490,34)">
        <circle r="8" stroke="#e879f9" stroke-opacity="0.5"/>
        <path d="M-5 3 L0 -6 L5 3" stroke="#fde68a" stroke-opacity="0.8">
          <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="19s" repeatCount="indefinite"/>
        </path>
      </g>
      <g transform="translate(790,34)">
        <circle r="11" stroke="#a78bfa" stroke-opacity="0.55"/>
        <path d="M0 -7 L6 0 L0 7 L-6 0 Z" stroke="#c4b5fd" stroke-opacity="0.9">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="31s" repeatCount="indefinite"/>
        </path>
      </g>
      <g transform="translate(1092,34)">
        <circle r="8" stroke="#67e8f9" stroke-opacity="0.5"/>
        <path d="M-5 3 L0 -6 L5 3" stroke="#a5f3fc" stroke-opacity="0.85">
          <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="22s" repeatCount="indefinite"/>
        </path>
      </g>
    </g>

    <!-- estrelas cintilando -->
    <g fill="#e9d5ff">
      <circle cx="80" cy="20" r="1.4"><animate attributeName="opacity" values="0.15;1;0.2" dur="4.4s" repeatCount="indefinite"/></circle>
      <circle cx="330" cy="46" r="1.2"><animate attributeName="opacity" values="0.1;0.9;0.15" dur="5.6s" begin="0.7s" repeatCount="indefinite"/></circle>
      <circle cx="640" cy="16" r="1.6"><animate attributeName="opacity" values="0.2;1;0.25" dur="3.9s" begin="1.3s" repeatCount="indefinite"/></circle>
      <circle cx="940" cy="48" r="1.3"><animate attributeName="opacity" values="0.1;0.85;0.2" dur="6.1s" begin="0.4s" repeatCount="indefinite"/></circle>
      <circle cx="1200" cy="18" r="1.5"><animate attributeName="opacity" values="0.15;1;0.2" dur="5.1s" begin="1.9s" repeatCount="indefinite"/></circle>
    </g>

    <!-- cantos com brilho -->
    <path d="M18 18 L18 46" stroke="#f6c177" stroke-opacity="0.5" stroke-width="2" fill="none"/>
    <path d="M1262 18 L1262 46" stroke="#67e8f9" stroke-opacity="0.5" stroke-width="2" fill="none"/>
    <circle cx="640" cy="34" r="3.4" fill="#fde68a" filter="url(#bt-glow)">
      <animate attributeName="r" values="2.6;4.6;2.6" dur="4.8s" repeatCount="indefinite"/>
    </circle>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="63" rx="18" fill="none" stroke="#a78bfa" stroke-opacity="0.3"/>
</svg>
