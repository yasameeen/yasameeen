<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 460" width="1280" height="460" role="img" aria-label="jornada: da sala de aula para a engenharia de software">
  <title>Jornada — da sala de aula para a engenharia</title>
  <defs>
    <linearGradient id="jbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0518"/><stop offset="55%" stop-color="#0d0620"/><stop offset="100%" stop-color="#0a0a22"/>
    </linearGradient>
    <radialGradient id="jh1" cx="0.1" cy="0.9" r="0.75">
      <stop offset="0%" stop-color="#f6c177" stop-opacity="0.20"/><stop offset="100%" stop-color="#f6c177" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="jh2" cx="0.92" cy="0.12" r="0.75">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.34"/><stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="jline" gradientUnits="userSpaceOnUse" x1="70" y1="252" x2="1210" y2="252">
      <stop offset="0%" stop-color="#f6c177" stop-opacity="0.15"/>
      <stop offset="26%" stop-color="#f6c177"/>
      <stop offset="52%" stop-color="#e879f9"/>
      <stop offset="78%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
    <filter id="jglow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="jsoft" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <clipPath id="jc"><rect width="1280" height="460" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#jc)">
    <rect width="1280" height="460" fill="url(#jbg)"/>
    <rect width="1280" height="460" fill="url(#jh1)"/>
    <rect width="1280" height="460" fill="url(#jh2)"/>
    <g stroke="#a78bfa" stroke-opacity="0.06"><path d="M0 120 H1280 M0 252 H1280 M0 372 H1280 M256 0 V460 M512 0 V460 M768 0 V460 M1024 0 V460"/></g>

    <text x="64" y="50" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="14" letter-spacing="4" fill="#f6c177">✦ DE ONDE EU VENHO — E PARA ONDE EU LEVO ISSO</text>

    <text x="64" y="86" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12.5" letter-spacing="3" fill="#f6c177" opacity="0.75">SALA DE AULA</text>
    <text x="1216" y="86" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12.5" letter-spacing="3" fill="#67e8f9" opacity="0.85" text-anchor="end">ENGENHARIA</text>
    <path d="M64 100 H610" stroke="#f6c177" stroke-opacity="0.26" stroke-width="1" fill="none"/>
    <path d="M670 100 H1216" stroke="#67e8f9" stroke-opacity="0.26" stroke-width="1" fill="none"/>

    <!-- a ponte: o momento da virada, flutuando acima da linha -->
    <g transform="translate(640,252)">
      <circle r="15" fill="#0d0620" stroke="#e879f9" stroke-opacity="0.7" stroke-width="1.2"/>
      <path d="M-6 3 L0 -7 L6 3" fill="none" stroke="#fde68a" stroke-width="1.6" stroke-linecap="round">
        <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="4.5s" repeatCount="indefinite"/>
      </path>
      <text x="0" y="-86" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12" letter-spacing="2.6" fill="#fde68a" text-anchor="middle">A VIRADA</text>
      <text x="0" y="-70" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="11.5" letter-spacing="1.4" fill="#c9c1e6" text-anchor="middle">ensinar virou construir</text>
      <path d="M0 -62 V-24" stroke="#fde68a" stroke-opacity="0.45" stroke-width="1" stroke-dasharray="2 4" fill="none"/>
      <circle r="3" cy="-62" fill="#fde68a">
        <animate attributeName="opacity" values="1;0.2;1" dur="4.5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- a linha da jornada se desenha -->
    <path d="M70 252 H1210" stroke="url(#jline)" stroke-width="9" fill="none" stroke-linecap="round" opacity="0.22" filter="url(#jsoft)"
          stroke-dasharray="1140" stroke-dashoffset="1140">
      <animate attributeName="stroke-dashoffset" from="1140" to="0" dur="2.6s" begin="0.3s" fill="freeze"/>
    </path>
    <path d="M70 252 H1210" stroke="url(#jline)" stroke-width="3" fill="none" stroke-linecap="round"
          stroke-dasharray="1140" stroke-dashoffset="1140">
      <animate attributeName="stroke-dashoffset" from="1140" to="0" dur="2.6s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.25 0.85 0.2 1"/>
    </path>

    <!-- marcos: espaçamento uniforme (288px), legendas curtas, sem colisão -->
    <g font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace">
      <g transform="translate(178,252)">
        <circle r="9" fill="#f6c177" filter="url(#jglow)"><animate attributeName="r" values="7.5;10;7.5" dur="5s" repeatCount="indefinite"/></circle>
        <circle r="20" fill="none" stroke="#f6c177" stroke-opacity="0.35"/>
        <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.6s" fill="freeze"/>
        <text x="0" y="-56" font-size="12" letter-spacing="2" fill="#f6c177" text-anchor="middle">2021 — 2023</text>
        <text x="0" y="-36" font-size="15.5" fill="#fef3c7" text-anchor="middle" font-family="'Iowan Old Style',Palatino,Georgia,serif">Colégio Sesi</text>
        <text x="0" y="52" font-size="12.5" fill="#c9c1e6" text-anchor="middle">ensino médio</text>
      </g>
      <g transform="translate(466,252)">
        <circle r="9" fill="#f6c177" filter="url(#jglow)"><animate attributeName="r" values="7.5;10;7.5" dur="5s" begin="0.8s" repeatCount="indefinite"/></circle>
        <circle r="20" fill="none" stroke="#f6c177" stroke-opacity="0.35"/>
        <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="1s" fill="freeze"/>
        <text x="0" y="-56" font-size="12" letter-spacing="2" fill="#f6c177" text-anchor="middle">2023 — 2024</text>
        <text x="0" y="-36" font-size="15.5" fill="#fef3c7" text-anchor="middle" font-family="'Iowan Old Style',Palatino,Georgia,serif">Professora · CNA+</text>
        <text x="0" y="52" font-size="12.5" fill="#c9c1e6" text-anchor="middle">sala de aula de verdade</text>
      </g>
      <g transform="translate(814,252)">
        <circle r="9" fill="#a78bfa" filter="url(#jglow)"><animate attributeName="r" values="7.5;10;7.5" dur="5s" begin="1.4s" repeatCount="indefinite"/></circle>
        <circle r="20" fill="none" stroke="#a78bfa" stroke-opacity="0.4"/>
        <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="1.6s" fill="freeze"/>
        <text x="0" y="-56" font-size="12" letter-spacing="2" fill="#a78bfa" text-anchor="middle">2024 — HOJE</text>
        <text x="0" y="-36" font-size="15.5" fill="#ede9fe" text-anchor="middle" font-family="'Iowan Old Style',Palatino,Georgia,serif">ADS · PUCPR</text>
        <text x="0" y="52" font-size="12.5" fill="#c9c1e6" text-anchor="middle">base formal da prática</text>
      </g>
      <g transform="translate(1102,252)">
        <circle r="11" fill="#67e8f9" filter="url(#jglow)"><animate attributeName="r" values="9;12;9" dur="4.4s" begin="0.5s" repeatCount="indefinite"/></circle>
        <circle r="24" fill="none" stroke="#67e8f9" stroke-opacity="0.5" stroke-dasharray="3 6">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
        </circle>
        <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="2.1s" fill="freeze"/>
        <text x="0" y="-60" font-size="12" letter-spacing="2" fill="#67e8f9" text-anchor="middle">2025 — HOJE</text>
        <text x="0" y="-40" font-size="15.5" fill="#e0fbff" text-anchor="middle" font-family="'Iowan Old Style',Palatino,Georgia,serif">Dev · Expandel</text>
        <text x="0" y="52" font-size="12.5" fill="#c9c1e6" text-anchor="middle">IA, dados e produto</text>
      </g>
    </g>

    <text x="64" y="416" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="13" letter-spacing="1.5" fill="#c9c1e6">
      a mesma pergunta de sala de aula, agora em código: <tspan fill="#f6c177">o aluno entendeu?</tspan>
    </text>
    <text x="1216" y="416" font-family="ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace" font-size="12" letter-spacing="2.4" fill="#8b81ad" text-anchor="end">Curitiba · PR</text>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="459" rx="18" fill="none" stroke="#a78bfa" stroke-opacity="0.26"/>
</svg>
