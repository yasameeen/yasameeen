<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 60" width="1280" height="60" role="img" aria-label="divisor arcano">
  <defs>
    <!-- um path horizontal tem bbox sem altura: gradiente precisa de userSpaceOnUse -->
    <linearGradient id="dv" gradientUnits="userSpaceOnUse" x1="0" y1="30" x2="552" y2="30">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0"/>
      <stop offset="55%" stop-color="#c4b5fd" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#fde68a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="dv2" gradientUnits="userSpaceOnUse" x1="728" y1="30" x2="1280" y2="30">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#c4b5fd" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="dvHalo">
      <stop offset="0%" stop-color="#f6c177" stop-opacity="0.38"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <filter id="dglow" x="-60%" y="-400%" width="220%" height="900%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <ellipse cx="640" cy="30" rx="130" ry="30" fill="url(#dvHalo)"/>
  <g filter="url(#dglow)">
    <path d="M0 30 H552" stroke="url(#dv)" stroke-width="1.5" fill="none">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="7s" repeatCount="indefinite"/>
    </path>
    <path d="M728 30 H1280" stroke="url(#dv2)" stroke-width="1.5" fill="none">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="7s" begin="1s" repeatCount="indefinite"/>
    </path>
  </g>

  <g transform="translate(640,30)" fill="none" stroke="#f6c177" stroke-width="1.5" stroke-linejoin="round">
    <circle r="19" stroke-opacity="0.30" stroke-width="1"/>
    <circle r="13.5" stroke-opacity="0.45" stroke-width="1" stroke-dasharray="2.5 5">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="34s" repeatCount="indefinite"/>
    </circle>
    <path d="M0 -12 L10.4 -3.4 L6.4 8.8 L-6.4 8.8 L-10.4 -3.4 Z">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="46s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="5s" repeatCount="indefinite"/>
    </path>
    <path d="M0 -6.5 L5.6 -1.8 L3.5 4.7 L-3.5 4.7 L-5.6 -1.8 Z" stroke="#e879f9" stroke-opacity="0.75">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="28s" repeatCount="indefinite"/>
    </path>
    <circle r="2.4" fill="#fde68a" stroke="none">
      <animate attributeName="r" values="1.8;3.1;1.8" dur="4.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g stroke="#67e8f9" stroke-width="1.3" fill="none" stroke-linecap="round">
    <path d="M584 30 L593 18 L602 30" stroke-opacity="0.55">
      <animate attributeName="stroke-opacity" values="0.3;0.9;0.3" dur="6s" repeatCount="indefinite"/>
    </path>
    <path d="M678 30 L687 42 L696 30" stroke-opacity="0.55">
      <animate attributeName="stroke-opacity" values="0.3;0.9;0.3" dur="6s" begin="1.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <g fill="#e9d5ff">
    <circle cx="520" cy="30" r="1.6" opacity="0.8"><animate attributeName="opacity" values="0.2;1;0.25" dur="4.4s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="30" r="1.6" opacity="0.8"><animate attributeName="opacity" values="0.2;1;0.25" dur="4.4s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="446" cy="24" r="1.1" opacity="0.5"><animate attributeName="opacity" values="0.1;0.8;0.15" dur="6.2s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="834" cy="36" r="1.1" opacity="0.5"><animate attributeName="opacity" values="0.1;0.8;0.15" dur="6.2s" begin="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="360" cy="30" r="1.2" opacity="0.45"><animate attributeName="opacity" values="0.15;0.75;0.2" dur="5.6s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="920" cy="30" r="1.2" opacity="0.45"><animate attributeName="opacity" values="0.15;0.75;0.2" dur="5.6s" begin="2.8s" repeatCount="indefinite"/></circle>
  </g>
</svg>
