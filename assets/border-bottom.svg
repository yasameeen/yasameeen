<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 64" width="1280" height="64" role="img" aria-label="borda decorativa animada — linha do crepúsculo">
  <title>bottom border — dusk line</title>
  <defs>
    <linearGradient id="bb-bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a0518"/><stop offset="55%" stop-color="#12082c"/><stop offset="100%" stop-color="#0a0518"/>
    </linearGradient>
    <linearGradient id="bb-line" gradientUnits="userSpaceOnUse" x1="0" y1="30" x2="1280" y2="30">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="34%" stop-color="#a78bfa"/>
      <stop offset="68%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#f6c177"/>
    </linearGradient>
    <linearGradient id="bb-sweep" gradientUnits="userSpaceOnUse" x1="0" y1="30" x2="380" y2="30">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="bb-hatch" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <line x1="0" y1="0" x2="0" y2="16" stroke="#67e8f9" stroke-opacity="0.06" stroke-width="6"/>
    </pattern>
    <filter id="bb-glow" x="-30%" y="-300%" width="160%" height="700%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="bb-clip"><rect width="1280" height="64" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#bb-clip)">
    <rect width="1280" height="64" fill="url(#bb-bg)"/>
    <rect width="1280" height="64" fill="url(#bb-hatch)"/>
    <rect x="0" y="62.6" width="1280" height="1.4" fill="url(#bb-line)" opacity="0.7"/>

    <path d="M0 30 H1280" stroke="url(#bb-line)" stroke-width="2" fill="none" opacity="0.85" filter="url(#bb-glow)"/>
    <path d="M0 30 H1280" stroke="#67e8f9" stroke-opacity="0.16" stroke-width="1" fill="none" transform="translate(0,9)"/>
    <path d="M0 30 H1280" stroke="#e879f9" stroke-opacity="0.12" stroke-width="1" fill="none" transform="translate(0,-9)"/>

    <rect x="1280" y="23" width="380" height="14" fill="url(#bb-sweep)" opacity="0.45">
      <animate attributeName="x" values="1280;-380" dur="9s" repeatCount="indefinite"/>
    </rect>

    <g fill="none" stroke-width="1.3">
      <g transform="translate(230,30)">
        <circle r="9" stroke="#67e8f9" stroke-opacity="0.5"/>
        <path d="M0 -6 L5.2 0 L0 6 L-5.2 0 Z" stroke="#a5f3fc" stroke-opacity="0.85">
          <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="24s" repeatCount="indefinite"/>
        </path>
      </g>
      <g transform="translate(560,30)">
        <circle r="11" stroke="#a78bfa" stroke-opacity="0.5"/>
        <path d="M-7 3 L0 -7 L7 3" stroke="#c4b5fd" stroke-opacity="0.85">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="29s" repeatCount="indefinite"/>
        </path>
      </g>
      <g transform="translate(880,30)">
        <circle r="8" stroke="#e879f9" stroke-opacity="0.5"/>
        <path d="M0 -6 L5.2 0 L0 6 L-5.2 0 Z" stroke="#f5d0fe" stroke-opacity="0.85">
          <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="21s" repeatCount="indefinite"/>
        </path>
      </g>
      <g transform="translate(1150,30)">
        <circle r="10" stroke="#f6c177" stroke-opacity="0.5"/>
        <path d="M-6 3 L0 -6 L6 3" stroke="#fde68a" stroke-opacity="0.85">
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="27s" repeatCount="indefinite"/>
        </path>
      </g>
    </g>

    <g fill="#e9d5ff">
      <circle cx="120" cy="44" r="1.3"><animate attributeName="opacity" values="0.15;1;0.2" dur="5.2s" repeatCount="indefinite"/></circle>
      <circle cx="430" cy="16" r="1.5"><animate attributeName="opacity" values="0.1;0.9;0.2" dur="4.6s" begin="0.9s" repeatCount="indefinite"/></circle>
      <circle cx="720" cy="46" r="1.2"><animate attributeName="opacity" values="0.2;1;0.25" dur="6s" begin="1.6s" repeatCount="indefinite"/></circle>
      <circle cx="1010" cy="14" r="1.4"><animate attributeName="opacity" values="0.1;0.85;0.15" dur="5.4s" begin="0.3s" repeatCount="indefinite"/></circle>
    </g>

    <path d="M18 18 L18 46" stroke="#67e8f9" stroke-opacity="0.45" stroke-width="2" fill="none"/>
    <path d="M1262 18 L1262 46" stroke="#f6c177" stroke-opacity="0.45" stroke-width="2" fill="none"/>
    <circle cx="640" cy="30" r="3" fill="#e879f9" filter="url(#bb-glow)">
      <animate attributeName="r" values="2.4;4.2;2.4" dur="5.4s" repeatCount="indefinite"/>
    </circle>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="63" rx="18" fill="none" stroke="#a78bfa" stroke-opacity="0.28"/>
</svg>
